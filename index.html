<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ================= utils ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(1337);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function smoothKeys(keys,t){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){
    const a=keys[i],b=keys[i+1];
    if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]);const s=(1-Math.cos(u*Math.PI))/2;return lerp(a[1],b[1],s);}
  }
  return keys[keys.length-1][1];
}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
let lastTE=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTE<300)e.preventDefault();lastTE=n;},{passive:false});

/* ================= audio ================= */
let AC=null, master=null, soundOn=true, verb=null, percNoise=null;
let padVoices=[], whooshGain=null, whooshFilter=null, droneOsc=null, droneGain=null;
const CHORDS=[
  {root:29,iv:[0,4,7,14]},   // Fmaj9 (I)
  {root:36,iv:[0,4,7,14]},   // Cmaj9 (V, bright lift)
  {root:34,iv:[0,4,7,14]},   // Bbmaj9 (IV)
  {root:29,iv:[0,4,7,14]},   // Fmaj9 (I, home)
  {root:31,iv:[0,4,7,14]},   // Gmaj9 (II, sunny borrowed chord)
  {root:29,iv:[0,4,7,14]},   // Fmaj9 (finale)
];
const m2f=m=>440*Math.pow(2,(m-69)/12);
function makeIR(dur,decay){
  const rate=AC.sampleRate,len=Math.floor(rate*dur),buf=AC.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
  return buf;
}
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.85;master.connect(AC.destination);
  // generated convolution reverb: the atmosphere
  verb=AC.createConvolver();verb.buffer=makeIR(3.0,2.8);
  const wet=AC.createGain();wet.gain.value=0.6;verb.connect(wet);wet.connect(master);
  // pad bus with Rhodes-style tremolo
  const padBus=AC.createGain();padBus.gain.value=1.0;
  const trem=AC.createGain();trem.gain.value=0.85;
  const lfo=AC.createOscillator();lfo.frequency.value=4.4;
  const lfoG=AC.createGain();lfoG.gain.value=0.12;
  lfo.connect(lfoG);lfoG.connect(trem.gain);lfo.start();
  padBus.connect(trem);trem.connect(master);trem.connect(verb);
  // Rhodes-ish voices: sine fundamental + soft octave bell
  CHORDS[0].iv.forEach(iv=>{
    const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=m2f(CHORDS[0].root+iv);
    const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=m2f(CHORDS[0].root+iv)*2.003;
    const b=AC.createGain();b.gain.value=0.10;o2.connect(b);
    const g=AC.createGain();g.gain.value=0.0001;
    o1.connect(g);b.connect(g);g.connect(padBus);
    o1.start();o2.start();
    padVoices.push({o1,o2,g});
  });
  // warm sub drone on the root
  droneOsc=AC.createOscillator();droneOsc.type='sine';droneOsc.frequency.value=m2f(CHORDS[0].root-12);
  droneGain=AC.createGain();droneGain.gain.value=0.0;
  droneOsc.connect(droneGain);droneGain.connect(master);droneGain.connect(verb);droneOsc.start();
  // whoosh: looped noise -> bandpass (kept, gentler)
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=AC.createBufferSource();n.buffer=buf;n.loop=true;
  whooshFilter=AC.createBiquadFilter();whooshFilter.type='bandpass';whooshFilter.frequency.value=500;whooshFilter.Q.value=0.8;
  whooshGain=AC.createGain();whooshGain.gain.value=0;
  n.connect(whooshFilter);whooshFilter.connect(whooshGain);whooshGain.connect(master);n.start();
  // percussion noise buffer (soft shaker ticks)
  percNoise=AC.createBuffer(1,Math.floor(AC.sampleRate*0.1),AC.sampleRate);
  {const pd=percNoise.getChannelData(0);for(let i=0;i<pd.length;i++)pd[i]=Math.random()*2-1;}
}
function setChord(idx,soft){
  if(!AC)return;const t=AC.currentTime,ch=CHORDS[idx];curChord=idx;
  padVoices.forEach((v,i)=>{
    const f=m2f(ch.root+ch.iv[i%ch.iv.length]);
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setTargetAtTime(0.0001,t,0.5);          // dip out like lifting the keys
    v.o1.frequency.setTargetAtTime(f,t+0.4,0.7);     // change chord while dipped
    v.o2.frequency.setTargetAtTime(f*2.003,t+0.4,0.7);
    v.g.gain.setTargetAtTime(soft?0.045:0.07,t+0.8,1.6); // bloom back in
  });
  droneOsc.frequency.setTargetAtTime(m2f(ch.root-12),t,1.0);
  droneGain.gain.setTargetAtTime(soft?0.02:0.035,t,1.5);
}
// tap dyads: two pentatonic notes a fifth apart (3 scale steps), picked at random
const FMAJ=[0,2,4,5,7,9,11]; // F major semitone offsets
let lastDyad=-1;
function chimeNote(t,midi,vol){
  [['triangle',1,vol],['sine',2,vol*0.35]].forEach(([ty,mult,v])=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=ty;o.frequency.value=m2f(midi)*mult;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
    o.connect(g);g.connect(master);if(verb)g.connect(verb);o.start(t);o.stop(t+1.2);
  });
}
/* tap phrase: opening dyad, then a two-note tail — every note rolls its own octave */
function chime(){
  if(!AC||!soundOn)return;const t=AC.currentTime;
  let d,o,key;
  do{ d=Math.floor(Math.random()*7); o=Math.floor(Math.random()*2); key=d+7*o; }while(key===lastDyad);
  lastDyad=key;
  const m1=53+12*o+FMAJ[d];
  const d2=(d+4)%7, o2=o+(d+4>=7?1:0);
  let m2=53+12*o2+FMAJ[d2];if(m2>100)m2-=12;
  chimeNote(t,m1,0.15);
  chimeNote(t,m2,0.15);
  for(let k=1;k<=2;k++){
    const dd=Math.floor(Math.random()*7),oo=Math.floor(Math.random()*3);
    chimeNote(t+k*0.40,53+12*oo+FMAJ[dd],0.11);
  }
}
/* generative Rhodes melody: a bright tune bouncing over the pad.
   F major random-walk phrases, a note roughly every second. */
/* melody walks the full F major scale (7 notes, not just pentatonic) */
let melTimer=null,melNext=0,melStep=3,curChord=0;
function melNote(t,midi,vol){
  const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=m2f(midi);
  const o2=AC.createOscillator();o2.type='triangle';o2.frequency.value=m2f(midi)*2.004;
  const b=AC.createGain();b.gain.value=0.05;o2.connect(b);
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.07);
  g.gain.exponentialRampToValueAtTime(0.0008,t+1.9);
  o1.connect(g);b.connect(g);g.connect(master);g.connect(verb);
  o1.start(t);o2.start(t);o1.stop(t+2.1);o2.stop(t+2.1);
}
function scheduleMelody(){
  if(!AC||!riding||!soundOn)return;
  const horizon=AC.currentTime+1.5;
  while(melNext<horizon){
    if(Math.random()>0.12){
      const deg=((melStep%7)+7)%7,oct=Math.floor(melStep/7);
      const midi=53+FMAJ[deg]+12*oct;
      melNote(melNext,midi,0.09);
      if(Math.random()<0.35)melNote(melNext+0.02,midi+12,0.03);
      melStep=Math.max(0,Math.min(13,melStep+Math.floor(Math.random()*5)-2));
    }
    melNext+=[0.8,1.0,1.0,1.5,2.2][Math.floor(Math.random()*5)];
  }
}
function startMelody(){stopMelody();if(!AC)return;melNext=AC.currentTime+1.5;melStep=3;melTimer=setInterval(scheduleMelody,300);}
function stopMelody(){if(melTimer){clearInterval(melTimer);melTimer=null;}}
/* light percussion: soft kick every beat, shaker on the off-beat, sparkle accent every 4th beat (grid stays 1s) */
let percTimer=null,percNext=0,percBeat=0;
function percKick(t){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(45,t+0.18);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.06,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
  o.connect(g);g.connect(master);g.connect(verb);
  o.start(t);o.stop(t+0.3);
}
function percTick(t){
  const n=AC.createBufferSource();n.buffer=percNoise;
  const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.025,t+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.06);
  n.connect(f);f.connect(g);g.connect(master);
  n.start(t);n.stop(t+0.08);
}
function schedulePerc(){
  if(!AC||!riding||!soundOn)return;
  const horizon=AC.currentTime+1.0;
  while(percNext<horizon){
    percKick(percNext);percTick(percNext+0.5);
    if(percBeat%4===2)percTick(percNext);
    percBeat++;percNext+=1.0;
  }
}
function startPerc(){stopPerc();if(!AC)return;percNext=AC.currentTime+0.5;percBeat=0;percTimer=setInterval(schedulePerc,250);}
function stopPerc(){if(percTimer){clearInterval(percTimer);percTimer=null;}}
document.getElementById('sndBtn').onclick=e=>{e.stopPropagation();soundOn=!soundOn;
  document.getElementById('sndBtn').style.opacity=soundOn?1:.4;
  if(master)master.gain.setTargetAtTime(soundOn?0.85:0,AC.currentTime,0.1);};

/* ================= renderer / scene ================= */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04030a);
scene.fog=new THREE.FogExp2(0x070512,0.0038);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.5,4200);
scene.add(camera);
scene.add(new THREE.AmbientLight(0x404060,1.2));
const dl=new THREE.DirectionalLight(0x8877ff,0.6);dl.position.set(50,100,50);scene.add(dl);

// post: bloom + vignette + filmic output
const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
composer.addPass(new RenderPass(scene,camera));
const bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.45,0.65,0.62);
composer.addPass(bloomPass);
const VignetteShader={
  uniforms:{tDiffuse:{value:null}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform sampler2D tDiffuse;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float d=distance(vUv,vec2(0.5,0.5));c.rgb*=mix(0.5,1.0,smoothstep(0.95,0.35,d));gl_FragColor=c;}'
};
composer.addPass(new ShaderPass(VignetteShader));
composer.addPass(new OutputPass());
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});

/* ================= shared GLSL ================= */
const NOISE_GLSL=`
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float noise3(vec3 p){
  vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.0-2.0*f);
  float n000=hash13(i);float n100=hash13(i+vec3(1.,0.,0.));
  float n010=hash13(i+vec3(0.,1.,0.));float n110=hash13(i+vec3(1.,1.,0.));
  float n001=hash13(i+vec3(0.,0.,1.));float n101=hash13(i+vec3(1.,0.,1.));
  float n011=hash13(i+vec3(0.,1.,1.));float n111=hash13(i+vec3(1.,1.,1.));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
             mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
}
float fbm(vec3 p){float a=0.5;float s=0.0;for(int i=0;i<4;i++){s+=a*noise3(p);p*=2.03;a*=0.5;}return s;}
`;
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.25,'rgba(255,255,255,.55)');
  g.addColorStop(0.6,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const GLOWTEX=glowTexture();
const PALETTE=[0x3dff9e,0x3dff9e,0x29e6ff,0x7dffce,0xb6ff3d,0x29e6ff,0xff3df0];

/* ================= nebula skybox ================= */
const nebulaUniforms={uTime:{value:0},uRush:{value:0}};
{
  const mat=new THREE.ShaderMaterial({
    uniforms:nebulaUniforms,side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:'varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`
      uniform float uTime;uniform float uRush;varying vec3 vDir;
      ${NOISE_GLSL}
      void main(){
        vec3 d=normalize(vDir);
        float n=fbm(d*2.5+vec3(0.0,uTime*0.008,uTime*0.005));
        float m=fbm(d*5.0-vec3(uTime*0.006));
        vec3 col=vec3(0.010,0.006,0.024);
        col+=vec3(0.11,0.045,0.21)*smoothstep(0.35,0.8,n);
        col+=vec3(0.02,0.16,0.20)*smoothstep(0.60,0.95,m)*smoothstep(0.30,0.70,n)*0.6;
        col+=vec3(0.23,0.05,0.17)*smoothstep(0.55,0.9,fbm(d*3.5+vec3(9.0)))*0.55;
        col+=vec3(0.02,0.15,0.08)*smoothstep(0.45,0.85,fbm(d*4.2+vec3(4.0)))*0.35;
        col+=vec3(0.26,0.15,0.03)*smoothstep(0.72,0.98,n*m)*0.5;
        col+=vec3(0.28,0.05,0.30)*uRush*smoothstep(0.35,0.85,n);
        vec3 g=floor(d*230.0);
        float h=hash13(g);
        float star=step(0.9986,h)*(0.4+0.6*abs(sin(uTime*1.5+h*40.0)));
        vec3 starCol=mix(vec3(0.75,0.85,1.0),vec3(1.0,0.87,0.68),step(0.5,fract(h*7.31)));
        col+=starCol*star*(0.35+0.65*smoothstep(0.25,0.75,n));
        gl_FragColor=vec4(col,1.0);
      }`
  });
  const sky=new THREE.Mesh(new THREE.SphereGeometry(3600,32,24),mat);
  sky.renderOrder=-10;scene.add(sky);
}

/* ================= flight path (invisible) ================= */
const PTS=[
  [0,10,0],[6,12,-50],
  [-14,10,-100],[14,12,-150],[-14,14,-200],[10,16,-250],

  if(!baseDQ){
    baseDQ=q.clone();qRel.identity();qRelS.identity();
    if(!headActive){headActive=true;
      if(!fixedMode)hintEl.innerHTML='Move your phone to look around &middot; Tap to pulse &middot; Hold to surge &middot; Double-tap to recenter';}
  }else{
    qRel.copy(q).multiply(tmpQ.copy(baseDQ).invert());
    qRelE.setFromQuaternion(qRel,'YXZ');qRelE.x=-qRelE.x;qRel.setFromEuler(qRelE); // pitch was inverted on device; yaw untouched
  }
}
window.addEventListener('deviceorientation',e=>onOrient(e,false));
window.addEventListener('deviceorientationabsolute',e=>onOrient(e,true));

const projV=new THREE.Vector3(),camDir=new THREE.Vector3(),toC=new THREE.Vector3();
/* chain-reaction waves: a tap ripples out along the threads, two hops deep */
let waveSeq=0;const waves=[];
function triggerWave(c0,hops){
  hops=hops||2;
  const id=++waveSeq;c0.waveId=id;
  let frontier=[c0];
  for(let h=1;h<=hops;h++){
    const next=[];
    frontier.forEach(c=>c.links.forEach(l=>{if(l.waveId!==id){l.waveId=id;waves.push({c:l,hop:h,t:performance.now()+400*h});next.push(l);}}));
    frontier=next;
  }
}
function doPulse(px,py,surge){
  // generous screen-space tap: nearest cluster within its glow radius
  camera.getWorldDirection(camDir);
  let best=null,bestD=1e9;
  for(const c of clusters){
    toC.copy(c.grp.position).sub(camera.position);
    if(toC.dot(camDir)<=0)continue;
    projV.copy(c.grp.position).project(camera);
    const sx=(projV.x*0.5+0.5)*innerWidth,sy=(-projV.y*0.5+0.5)*innerHeight;
    const d=Math.hypot(px-sx,py-sy);
    const r=55+c.scale*7;
    if(d<r&&d<bestD){best=c;bestD=d;}
  }
  if(!best)return;
  let onBeat=false;
  if(AC&&soundOn&&percNext>0){const tNow=AC.currentTime;
    if(percNext-tNow<2.5){const ph=((tNow-percNext)%1+1)%1;onBeat=Math.min(ph,1-ph)<=0.14;}}
  best.flash=1;spawnRing(best.grp.position,onBeat?0xffd27a:best.color,surge?1.35:1);chime();
  triggerWave(best,(surge||onBeat)?3:2);
  if(surge&&navigator.vibrate)navigator.vibrate(18);
  if(!best.tapped){
    best.tapped=true;tappedCount++;updateBalls();
    if(fixedMode){best.halo.material.opacity=0.05;best.inner.material.opacity=0.35;} // collected look
    else{best.halo.material.opacity=0.34;best.inner.material.opacity=0.85;} // lit trail: stays glowing behind you
  }
}
function updateBalls(){ballsEl.textContent='Sound balls  '+tappedCount+' / '+clusters.length;}

/* ================= flow ================= */
const fadeEl=document.getElementById('fade'),titleEl=document.getElementById('title'),
      endEl=document.getElementById('end'),hudEl=document.getElementById('hud'),
      hintEl=document.getElementById('hint'),progEl=document.getElementById('progfill'),
      ballsEl=document.getElementById('balls'),endText=document.getElementById('endText');
const modeLook=document.getElementById('modeLook'),modeFixed=document.getElementById('modeFixed'),
      modeDesc=document.getElementById('modeDesc');
modeLook.onclick=()=>{fixedMode=false;modeLook.classList.add('on');modeFixed.classList.remove('on');
  modeDesc.textContent='Move your phone to look around the mindscape.';};
modeFixed.onclick=()=>{fixedMode=true;modeFixed.classList.add('on');modeLook.classList.remove('on');
  modeDesc.textContent='Camera locked forward. Tap every sound ball as it passes.';};
function beginRide(){
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().catch(()=>{});
  }
  titleEl.classList.add('hidden');endEl.classList.add('hidden');
  riding=true;rt=0;curSeg=-1;
  baseDQ=null;baseIsAbs=false;headActive=false;qRel.identity();qRelS.identity();
  tappedCount=0;
  clusters.forEach(c=>{c.tapped=false;c.halo.material.opacity=0.18;c.inner.material.opacity=0.6;});
  updateBalls();ballsEl.style.display=fixedMode?'block':'none';
  hudEl.classList.add('on');hintEl.classList.add('on');
  hintEl.innerHTML=fixedMode?'Tap the sound balls as they pass':'Drag to look around &middot; Tap to pulse &middot; Hold to surge';
  setTimeout(()=>hintEl.classList.remove('on'),9000);
  if(!fixedMode)setTimeout(()=>{if(riding&&!headActive){hintEl.innerHTML='No motion sensor reaching the app here &middot; Drag to look around &middot; Tap a cluster to pulse it';hintEl.classList.add('on');setTimeout(()=>hintEl.classList.remove('on'),9000);}},1800);
  setChord(0,false);startMelody();startPerc();
}
document.getElementById('beginBtn').onclick=beginRide;
document.getElementById('againBtn').onclick=beginRide;
let paused=false;
document.addEventListener('visibilitychange',()=>{paused=document.hidden;});

const orbitC=new THREE.Vector3(0,26,-120);
function preRideCam(now){
  const a=now*0.00006;
  camera.position.set(orbitC.x+Math.cos(a)*90,orbitC.y+14,orbitC.z+Math.sin(a)*90);
  camera.lookAt(orbitC.x,orbitC.y-6,orbitC.z-60);
  camera.fov=60;camera.updateProjectionMatrix();
}
function driftDust(p,dt){
  const dp=p.geometry.attributes.position,vel=p.userData.vel;
  for(let i=0;i<dp.count;i++){
    let y=dp.getY(i)+vel[i*3+1]*dt;
    if(y>160)y=-20;if(y<-25)y=155;
    dp.setXYZ(i,dp.getX(i)+vel[i*3]*dt,y,dp.getZ(i)+vel[i*3+2]*dt);
  }
  dp.needsUpdate=true;
}

/* ================= main loop ================= */
let last=performance.now(),fpsAcc=0,fpsN=0,degraded=false;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-last)/1000,0.05);last=now;
  if(paused)return;
  const tsec=now/1000;
  nebulaUniforms.uTime.value=tsec;
  for(const tm of threadMats)tm.uniforms.uTime.value=tsec;

  for(const c of clusters){
    c.sats.rotation.y=c.orbit+tsec*c.orbitSpd;
    if(c.dend)c.dend.rotation.y-=dt*0.06;
    if(c.flash>0){
      c.flash=Math.max(0,c.flash-dt*1.4);
      const f=1+c.flash*1.6;
      c.inner.scale.setScalar(c.scale*4.5*f);
      c.halo.scale.setScalar(c.scale*11*f);
      c.core.material.uniforms.uFlash.value=c.flash;
      c.threads.forEach(m=>{m.uniforms.uFlash.value=c.flash;});
      if(c.dend)c.dend.material.opacity=0.38+c.flash*0.62;
    }
  }
  driftDust(dustNear,dt);driftDust(dustFar,dt);
  // chain-reaction waves firing on schedule
  {
    const nowMs=performance.now();
    for(let i=waves.length-1;i>=0;i--){
      const w=waves[i];
      if(nowMs>=w.t){
        waves.splice(i,1);
        w.c.flash=Math.max(w.c.flash,w.hop===1?0.7:w.hop===2?0.45:0.3);
        spawnRing(w.c.grp.position,w.c.color,w.hop===1?0.6:w.hop===2?0.45:0.35);
        if(AC&&soundOn){
          const d=Math.floor(Math.random()*7),oo=Math.floor(Math.random()*3);
          chimeNote(AC.currentTime,53+12*oo+FMAJ[d],0.06);
        }
      }
    }
  }
  // heart pulse + slow ring turns
  heartCore.material.uniforms.uFlash.value=0.25+0.15*Math.sin(tsec*1.1);
  heartInner.scale.setScalar(13*(1+0.06*Math.sin(tsec*1.1)));
  heartRings.forEach((r,i)=>{r.rotation.x+=dt*(0.04+i*0.02);r.rotation.y+=dt*(0.03+i*0.015);});
  // shafts breathe + sway
  shaftTime.value=tsec;
  shafts.forEach(m=>{m.rotation.z=m.userData.tilt+Math.sin(tsec*0.2+m.userData.i*1.7)*0.02;});
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.t+=dt;
    r.m.scale.setScalar((1+r.t*34)*(r.s||1));r.m.material.opacity=Math.max(0,0.9-r.t*1.1);
    r.m.lookAt(camera.position);
    if(r.t>1){scene.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();rings.splice(i,1);}
  }

  // prism gates: counter-rotation, streaming hues, pass flash decay
  for(const gt of gates){
    if(Math.abs(gt.u-rt)>0.13&&gt.flash<=0)continue;
    gt.spinA.rotation.z+=dt*1.5*gt.dir;
    gt.spinB.rotation.z-=dt*0.9*gt.dir;
    if(gt.flash>0)gt.flash=Math.max(0,gt.flash-dt*2.2);
    const hue=(gt.hue+tsec*0.03)%1;
    gt.om.color.setHSL(hue,0.95,0.55+gt.flash*0.25);
    gt.im.color.setHSL((hue+0.5)%1,0.95,0.5+gt.flash*0.3);
  }
  if(gateShardMat)gateShardMat.color.setHSL((tsec*0.03+0.15)%1,0.9,0.5);
  if(charging){const pr=Math.min(1,(performance.now()-chargeT0)/450);
    chargeEl.style.transform='translate(-50%,-50%) scale('+(0.6+0.55*pr)+')';
    chargeEl.style.borderColor='rgba(255,210,122,'+(0.15+0.75*pr)+')';}
  nebulaUniforms.uRush.value*=Math.pow(0.1,dt);
  if(!riding){preRideCam(now);streaks.material.opacity=0;composer.render();return;}

  tunnelBlend=lerp(tunnelBlend,inTunnel(rt,0.004)?1:0,1-Math.pow(0.02,dt));
  const rtPrev=rt;
  const spd=smoothKeys(SPEED_KEYS,rt)*(1+0.3*tunnelBlend);
  rt=Math.min(1,rt+spd*dt);
  // gate passes: flash + whoosh + fov kick
  for(const gt of gates){if(rtPrev<gt.u&&rt>=gt.u){gt.flash=1;whooshKick=1;fovKick=Math.max(fovKick,5);}}
  // ambient life: a nearby cluster fires a pulse on its own every few seconds
  ambT-=dt;
  if(ambT<=0){ambT=2.2+Math.random()*1.4;
    let best=null,bd=95*95;
    for(const c of clusters){const d=c.grp.position.distanceToSquared(lookP);if(d<bd){bd=d;best=c;}}
    if(best)triggerWave(best,1);
  }
  const seg=SEG_OF_T(rt);
  if(seg!==curSeg){curSeg=seg;setChord(seg,seg===3);}
  curve.getPointAt(rt,lookP);curve.getPointAt(Math.min(1,rt+0.012),lookT);
  camera.position.copy(lookP);
  // cinematic handheld drift
  camera.position.x+=Math.sin(tsec*0.5)*0.7+Math.sin(tsec*1.31)*0.3;
  camera.position.y+=Math.sin(tsec*0.42+2.0)*0.5;
  camera.up.set(0,1,0);camera.lookAt(lookT);
  curve.getTangentAt(rt,tanV);curve.getTangentAt(Math.min(1,rt+0.004),tan2);
  const cross=tanV.x*tan2.z-tanV.z*tan2.x;
  const targetRoll=clamp(-cross*340,-0.85,0.85);
  rollSm=lerp(rollSm,targetRoll,1-Math.pow(0.001,dt));
  camera.rotateZ(rollSm);
  if(!fixedMode){
    if(headActive){
      // unrestricted 360 look: head-relative rotation applied to the track view
      qRelS.slerp(qRel,1-Math.pow(0.000001,dt));
      tmpQ.copy(camera.quaternion);
      camera.quaternion.copy(tmpQ).multiply(qRelS); // head delta in camera-local frame, so turns stay true as the track bends
    }else{
      yaw=lerp(yaw,yawT,1-Math.pow(0.0001,dt));pitch=lerp(pitch,pitchT,1-Math.pow(0.0001,dt));
      camera.rotateY(yaw);camera.rotateX(pitch);
    }
  }
  // fixed camera: pure track view, nothing else touches it
  const sNorm=clamp(spd/0.014,0,1);
  fovKick*=Math.pow(0.05,dt);
  fovSm=lerp(fovSm,62+sNorm*26+tunnelBlend*8+fovKick,1-Math.pow(0.01,dt));
  if(Math.abs(camera.fov-fovSm)>0.1){camera.fov=fovSm;camera.updateProjectionMatrix();}
  nebulaUniforms.uRush.value=lerp(nebulaUniforms.uRush.value,clamp((sNorm-0.45)/0.55,0,1),1-Math.pow(0.01,dt));
  {
    const sp=streaks.geometry.attributes.position,vz=(14+sNorm*215+tunnelBlend*130)*dt;
    for(let i=0;i<sp.count;i++){
      let z=sp.getZ(i)+vz;
      if(z>2){z-=107;sp.setX(i,(Math.random()-0.5)*60);sp.setY(i,(Math.random()-0.5)*40);}
      sp.setZ(i,z);
    }
    sp.needsUpdate=true;
    streaks.material.opacity=0.05+sNorm*0.6;
  }
  if(AC&&soundOn){
    whooshKick*=Math.pow(0.02,dt);
    whooshGain.gain.setTargetAtTime(sNorm*sNorm*0.05+whooshKick*0.05,AC.currentTime,0.15);
    whooshFilter.frequency.setTargetAtTime(350+sNorm*1600,AC.currentTime,0.15);
  }
  progEl.style.width=(rt*100).toFixed(1)+'%';

  if(rt>=1){
    riding=false;stopMelody();stopPerc();hudEl.classList.remove('on');
    if(fixedMode)endText.textContent='You tapped '+tappedCount+' of '+clusters.length+' sound balls.';
    else endText.textContent='The threads settle. The clusters keep their light.';
    fadeEl.style.opacity=1;
    setTimeout(()=>{endEl.classList.remove('hidden');fadeEl.style.opacity=0;},1300);
    if(AC){padVoices.forEach(v=>v.g.gain.setTargetAtTime(0.0001,AC.currentTime,1.2));
      droneGain.gain.setTargetAtTime(0.0001,AC.currentTime,1.0);
      whooshGain.gain.setTargetAtTime(0,AC.currentTime,0.4);}
  }
  composer.render();

  if(!degraded){
    fpsAcc+=dt;fpsN++;
    if(fpsN>=140){
      if(fpsAcc/fpsN>0.026){
        degraded=true;renderer.setPixelRatio(1);composer.setPixelRatio(1);
        dustFar.visible=false;bloomPass.strength=0.6;
      }
      fpsAcc=0;fpsN=0;
    }
  }
}
fadeEl.style.opacity=0;
requestAnimationFrame(frame);
</script>
</body>
