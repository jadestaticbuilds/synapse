<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ================= utils ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(1337);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function smoothKeys(keys,t){
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){
    const a=keys[i],b=keys[i+1];
    if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]);const s=(1-Math.cos(u*Math.PI))/2;return lerp(a[1],b[1],s);}
  }
  return keys[keys.length-1][1];
}
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
let lastTE=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTE<300)e.preventDefault();lastTE=n;},{passive:false});

/* ================= audio ================= */
let AC=null, master=null, soundOn=true, verb=null;
let padVoices=[], whooshGain=null, whooshFilter=null, droneOsc=null, droneGain=null;
const CHORDS=[
  {root:45,iv:[0,3,7,14]},   // Am9
  {root:41,iv:[0,4,7,14]},   // Fmaj9
  {root:48,iv:[0,4,7,14]},   // Cmaj9
  {root:48,iv:[0,4,7,14]},   // Cmaj9 (breather, softer)
  {root:50,iv:[0,3,7,14]},   // Dm9
  {root:43,iv:[0,4,9,14]},   // G add9
];
const m2f=m=>440*Math.pow(2,(m-69)/12);
function makeIR(dur,decay){
  const rate=AC.sampleRate,len=Math.floor(rate*dur),buf=AC.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);}
  return buf;
}
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.85;master.connect(AC.destination);
  // generated convolution reverb: the atmosphere
  verb=AC.createConvolver();verb.buffer=makeIR(3.0,2.8);
  const wet=AC.createGain();wet.gain.value=0.6;verb.connect(wet);wet.connect(master);
  // pad bus with Rhodes-style tremolo
  const padBus=AC.createGain();padBus.gain.value=1.0;
  const trem=AC.createGain();trem.gain.value=0.85;
  const lfo=AC.createOscillator();lfo.frequency.value=4.4;
  const lfoG=AC.createGain();lfoG.gain.value=0.12;
  lfo.connect(lfoG);lfoG.connect(trem.gain);lfo.start();
  padBus.connect(trem);trem.connect(master);trem.connect(verb);
  // Rhodes-ish voices: sine fundamental + soft octave bell
  CHORDS[0].iv.forEach(iv=>{
    const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=m2f(CHORDS[0].root+iv);
    const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=m2f(CHORDS[0].root+iv)*2.003;
    const b=AC.createGain();b.gain.value=0.10;o2.connect(b);
    const g=AC.createGain();g.gain.value=0.0001;
    o1.connect(g);b.connect(g);g.connect(padBus);
    o1.start();o2.start();
    padVoices.push({o1,o2,g});
  });
  // warm sub drone on the root
  droneOsc=AC.createOscillator();droneOsc.type='sine';droneOsc.frequency.value=m2f(CHORDS[0].root-12);
  droneGain=AC.createGain();droneGain.gain.value=0.0;
  droneOsc.connect(droneGain);droneGain.connect(master);droneGain.connect(verb);droneOsc.start();
  // whoosh: looped noise -> bandpass (kept, gentler)
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=AC.createBufferSource();n.buffer=buf;n.loop=true;
  whooshFilter=AC.createBiquadFilter();whooshFilter.type='bandpass';whooshFilter.frequency.value=500;whooshFilter.Q.value=0.8;
  whooshGain=AC.createGain();whooshGain.gain.value=0;
  n.connect(whooshFilter);whooshFilter.connect(whooshGain);whooshGain.connect(master);n.start();
}
function setChord(idx,soft){
  if(!AC)return;const t=AC.currentTime,ch=CHORDS[idx];curChord=idx;
  padVoices.forEach((v,i)=>{
    const f=m2f(ch.root+ch.iv[i%ch.iv.length]);
    v.g.gain.cancelScheduledValues(t);
    v.g.gain.setTargetAtTime(0.0001,t,0.5);          // dip out like lifting the keys
    v.o1.frequency.setTargetAtTime(f,t+0.4,0.7);     // change chord while dipped
    v.o2.frequency.setTargetAtTime(f*2.003,t+0.4,0.7);
    v.g.gain.setTargetAtTime(soft?0.045:0.07,t+0.8,1.6); // bloom back in
  });
  droneOsc.frequency.setTargetAtTime(m2f(ch.root-12),t,1.0);
  droneGain.gain.setTargetAtTime(soft?0.02:0.035,t,1.5);
}
const PENTA=[69,72,74,76,79,81];let pentaIdx=0;
function chime(){
  if(!AC||!soundOn)return;const t=AC.currentTime;
  const m=PENTA[pentaIdx%PENTA.length];pentaIdx++;
  [['triangle',1,0.20],['sine',2,0.07]].forEach(([ty,mult,v])=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=ty;o.frequency.value=m2f(m)*mult;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
    o.connect(g);g.connect(master);if(verb)g.connect(verb);o.start(t);o.stop(t+1.2);
  });
}
/* generative Rhodes melody: a sparse tune wandering over the pad.
   Pentatonic random-walk phrases, one note every couple of seconds. */
const MAJ_PENTA=[0,2,4,7,9],MIN_PENTA=[0,3,5,7,10];
const CHORD_QUAL=[0,1,1,1,0,1]; // per CHORDS entry: 0=minor penta, 1=major penta
let melTimer=null,melNext=0,melStep=3,curChord=0;
function melNote(t,midi,vol){
  const o1=AC.createOscillator();o1.type='sine';o1.frequency.value=m2f(midi);
  const o2=AC.createOscillator();o2.type='triangle';o2.frequency.value=m2f(midi)*2.004;
  const b=AC.createGain();b.gain.value=0.05;o2.connect(b);
  const g=AC.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(vol,t+0.07);
  g.gain.exponentialRampToValueAtTime(0.0008,t+3.0);
  o1.connect(g);b.connect(g);g.connect(master);g.connect(verb);
  o1.start(t);o2.start(t);o1.stop(t+3.2);o2.stop(t+3.2);
}
function scheduleMelody(){
  if(!AC||!riding||!soundOn)return;
  const horizon=AC.currentTime+1.5;
  while(melNext<horizon){
    const ch=CHORDS[curChord],scale=CHORD_QUAL[curChord]?MAJ_PENTA:MIN_PENTA;
    if(Math.random()>0.22){
      const deg=((melStep%5)+5)%5,oct=Math.floor(melStep/5);
      const midi=ch.root+12+scale[deg]+12*oct;
      melNote(melNext,midi,0.085);
      if(Math.random()<0.25)melNote(melNext+0.02,midi+12,0.03);
      melStep=Math.max(0,Math.min(10,melStep+Math.floor(Math.random()*5)-2));
    }
    melNext+=[1.6,2.2,2.2,3.0,4.2][Math.floor(Math.random()*5)];
  }
}
function startMelody(){stopMelody();if(!AC)return;melNext=AC.currentTime+1.5;melStep=3;melTimer=setInterval(scheduleMelody,300);}
function stopMelody(){if(melTimer){clearInterval(melTimer);melTimer=null;}}
document.getElementById('sndBtn').onclick=e=>{e.stopPropagation();soundOn=!soundOn;
  document.getElementById('sndBtn').style.opacity=soundOn?1:.4;
  if(master)master.gain.setTargetAtTime(soundOn?0.85:0,AC.currentTime,0.1);};

/* ================= renderer / scene ================= */
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04030a);
scene.fog=new THREE.FogExp2(0x070512,0.0038);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.5,4200);
scene.add(camera);
scene.add(new THREE.AmbientLight(0x404060,1.2));
const dl=new THREE.DirectionalLight(0x8877ff,0.6);dl.position.set(50,100,50);scene.add(dl);

// post: bloom + vignette + filmic output
const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
composer.addPass(new RenderPass(scene,camera));
const bloomPass=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.45,0.65,0.62);
composer.addPass(bloomPass);
const VignetteShader={
  uniforms:{tDiffuse:{value:null}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader:'uniform sampler2D tDiffuse;varying vec2 vUv;void main(){vec4 c=texture2D(tDiffuse,vUv);float d=distance(vUv,vec2(0.5,0.5));c.rgb*=mix(0.5,1.0,smoothstep(0.95,0.35,d));gl_FragColor=c;}'
};
composer.addPass(new ShaderPass(VignetteShader));
composer.addPass(new OutputPass());
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);
});

/* ================= shared GLSL ================= */
const NOISE_GLSL=`
float hash13(vec3 p){p=fract(p*0.1031);p+=dot(p,p.zyx+31.32);return fract((p.x+p.y)*p.z);}
float noise3(vec3 p){
  vec3 i=floor(p);vec3 f=fract(p);f=f*f*(3.0-2.0*f);
  float n000=hash13(i);float n100=hash13(i+vec3(1.,0.,0.));
  float n010=hash13(i+vec3(0.,1.,0.));float n110=hash13(i+vec3(1.,1.,0.));
  float n001=hash13(i+vec3(0.,0.,1.));float n101=hash13(i+vec3(1.,0.,1.));
  float n011=hash13(i+vec3(0.,1.,1.));float n111=hash13(i+vec3(1.,1.,1.));
  return mix(mix(mix(n000,n100,f.x),mix(n010,n110,f.x),f.y),
             mix(mix(n001,n101,f.x),mix(n011,n111,f.x),f.y),f.z);
}
float fbm(vec3 p){float a=0.5;float s=0.0;for(int i=0;i<4;i++){s+=a*noise3(p);p*=2.03;a*=0.5;}return s;}
`;
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.25,'rgba(255,255,255,.55)');
  g.addColorStop(0.6,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const GLOWTEX=glowTexture();
const PALETTE=[0xffd27a,0x7ae2ff,0xb48cff,0x6dffc9,0xff7ad9,0xfff3d6];

/* ================= nebula skybox ================= */
const nebulaUniforms={uTime:{value:0}};
{
  const mat=new THREE.ShaderMaterial({
    uniforms:nebulaUniforms,side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:'varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`
      uniform float uTime;varying vec3 vDir;
      ${NOISE_GLSL}
      void main(){
        vec3 d=normalize(vDir);
        float n=fbm(d*2.5+vec3(0.0,uTime*0.008,uTime*0.005));
        float m=fbm(d*5.0-vec3(uTime*0.006));
        vec3 col=vec3(0.008,0.006,0.020);
        col+=vec3(0.10,0.045,0.20)*smoothstep(0.35,0.8,n);
        col+=vec3(0.22,0.10,0.045)*smoothstep(0.60,0.95,m)*smoothstep(0.30,0.70,n)*0.55;
        col+=vec3(0.03,0.10,0.14)*smoothstep(0.55,0.9,fbm(d*3.5+vec3(9.0)))*0.5;
        vec3 g=floor(d*230.0);
        float h=hash13(g);
        float star=step(0.9986,h)*(0.4+0.6*abs(sin(uTime*1.5+h*40.0)));
        col+=vec3(0.85,0.9,1.0)*star*(0.35+0.65*smoothstep(0.25,0.75,n));
        gl_FragColor=vec4(col,1.0);
      }`
  });
  const sky=new THREE.Mesh(new THREE.SphereGeometry(3600,32,24),mat);
  sky.renderOrder=-10;scene.add(sky);
}

/* ================= flight path (invisible) ================= */
const PTS=[
  [0,0,0],[12,10,-30],[-12,22,-60],[10,34,-90],[-8,46,-115],[0,58,-140],
  [0,62,-155],[6,50,-175],[0,28,-195],[-4,8,-215],[0,-4,-235],[0,-6,-255],
  [22,0,-280],[-24,4,-305],[28,2,-330],[-28,8,-355],[22,4,-380],[-18,8,-405],[0,10,-430],
  [8,16,-470],[-6,24,-515],[4,30,-560],
  [2,32,-600],[-4,34,-640],[6,32,-680],[-6,34,-720],[0,32,-760],
  [0,40,-800],[4,52,-845],[0,62,-890],[0,66,-930]
].map(p=>new THREE.Vector3(p[0],p[1],p[2]));
const curve=new THREE.CatmullRomCurve3(PTS,false,'catmullrom',0.35);

/* ================= cluster materials ================= */
function coreMaterial(color){
  return new THREE.ShaderMaterial({
    uniforms:{uColor:{value:new THREE.Color(color)},uFlash:{value:0}},
    vertexShader:`
      varying vec3 vN;varying vec3 vV;
      void main(){
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        vN=normalMatrix*normal;vV=-mv.xyz;
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform vec3 uColor;uniform float uFlash;
      varying vec3 vN;varying vec3 vV;
      void main(){
        vec3 n=normalize(vN);vec3 v=normalize(vV);
        float fr=pow(1.0-abs(dot(n,v)),2.2);
        vec3 col=uColor*0.18+uColor*fr*1.7;
        col=mix(col,vec3(1.0),uFlash*0.75);
        gl_FragColor=vec4(col,1.0);
      }`
  });
}
function threadMaterial(color){
  return new THREE.ShaderMaterial({
    uniforms:{uColor:{value:new THREE.Color(color)},uTime:{value:rng()*20},uFlash:{value:0}},
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,
    vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`
      uniform vec3 uColor;uniform float uTime;uniform float uFlash;
      varying vec2 vUv;
      void main(){
        float p=pow(0.5+0.5*sin((vUv.x*3.0-uTime*0.5)*6.28318),6.0);
        vec3 col=uColor*(0.22+p*1.5+uFlash*1.6);
        gl_FragColor=vec4(col,0.45+p*0.25);
      }`
  });
}

/* ================= clusters + threads ================= */
const clusters=[],clusterMeshes=[],threadMats=[];
const coreGeo=new THREE.SphereGeometry(1,24,24);
function addCluster(pos,color,scale){
  const grp=new THREE.Group();grp.position.copy(pos);
  const core=new THREE.Mesh(coreGeo,coreMaterial(color));
  core.scale.setScalar(scale);grp.add(core);
  // layered glow: tight inner + wide halo
  const inner=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOWTEX,color:color,transparent:true,opacity:0.6,blending:THREE.AdditiveBlending,depthWrite:false}));
  inner.scale.setScalar(scale*4.5);grp.add(inner);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:GLOWTEX,color:color,transparent:true,opacity:0.18,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.scale.setScalar(scale*11);grp.add(halo);
  const sats=new THREE.Group();
  const n=3+Math.floor(rng()*3);
  for(let i=0;i<n;i++){
    const s=new THREE.Mesh(coreGeo,new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.9}));
    const ss=scale*(0.16+rng()*0.22);s.scale.setScalar(ss);
    const a=rng()*Math.PI*2,r=scale*(2.6+rng()*2.4);
    s.position.set(Math.cos(a)*r,(rng()-0.5)*r*1.3,Math.sin(a)*r);
    sats.add(s);
  }
  grp.add(sats);scene.add(grp);
  const c={grp,core,inner,halo,sats,color,scale,flash:0,threads:[],orbit:rng()*Math.PI*2,orbitSpd:0.15+rng()*0.3};
  clusters.push(c);clusterMeshes.push(core);core.userData.cluster=c;
  return c;
}
{
  const tmp=new THREE.Vector3(),tan=new THREE.Vector3(),side=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
  let placed=0,guard=0;
  while(placed<52&&guard++<800){
    const t=0.03+rng()*0.94;
    if(t>0.68&&t<0.87)continue;
    curve.getPointAt(t,tmp);curve.getTangentAt(t,tan);
    side.crossVectors(tan,up).normalize();
    const off=(side.clone().multiplyScalar((rng()<0.5?-1:1)*(16+rng()*46)))
      .add(new THREE.Vector3(0,(rng()-0.35)*36,0));
    addCluster(tmp.clone().add(off),PALETTE[Math.floor(rng()*PALETTE.length)],1.4+rng()*2.6);
    placed++;
  }
  clusters.forEach((c,i)=>{
    const dists=clusters.map((o,j)=>({j,d:o.grp.position.distanceToSquared(c.grp.position)}))
      .filter(o=>o.j!==i).sort((a,b)=>a.d-b.d).slice(0,2);
    dists.forEach(({j})=>{
      if(j<i)return;
      const o=clusters[j],a=c.grp.position,b=o.grp.position;
      const mid=a.clone().add(b).multiplyScalar(0.5);mid.y+=a.distanceTo(b)*0.12;
      const bc=new THREE.QuadraticBezierCurve3(a,mid,b);
      const tm=threadMaterial(new THREE.Color(c.color).lerp(new THREE.Color(o.color),0.5));
      const mesh=new THREE.Mesh(new THREE.TubeGeometry(bc,16,0.16,5,false),tm);
      scene.add(mesh);
      c.threads.push(tm);o.threads.push(tm);threadMats.push(tm);
    });
  });
}
/* thread tunnel (t 0.70-0.85) */
{
  const ringMat=new THREE.MeshBasicMaterial({color:0x7ae2ff,transparent:true,opacity:0.55,blending:THREE.AdditiveBlending,depthWrite:false});
  const tmp=new THREE.Vector3(),tan=new THREE.Vector3();
  let prev=null;
  for(let i=0;i<=10;i++){
    const t=0.70+i*0.015;curve.getPointAt(t,tmp);curve.getTangentAt(t,tan);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(15,0.35,6,48),ringMat);
    ring.position.copy(tmp);
    ring.lookAt(tmp.clone().add(tan));
    scene.add(ring);
    if(prev){
      for(let k=0;k<8;k++){
        const a=k/8*Math.PI*2;
        const p1=new THREE.Vector3(Math.cos(a)*15,Math.sin(a)*15,0).add(prev.p);
        const p2=new THREE.Vector3(Math.cos(a)*15,Math.sin(a)*15,0).add(tmp);
        const g=new THREE.BufferGeometry().setFromPoints([p1,p2]);
        scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xb48cff,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending})));
      }
    }
    prev={p:tmp.clone()};
  }
}
/* finale vista: vast distant cluster field */
{
  for(let i=0;i<170;i++){
    const m=new THREE.SpriteMaterial({map:GLOWTEX,color:PALETTE[Math.floor(rng()*PALETTE.length)],
      transparent:true,opacity:0.5+rng()*0.4,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
    const s=new THREE.Sprite(m);
    s.position.set((rng()-0.5)*900,20+rng()*220,-980-rng()*700);
    s.scale.setScalar(6+rng()*22);
    scene.add(s);
  }
}
/* marble silhouettes with veined shader */
{
  const mg=new THREE.IcosahedronGeometry(1,3);
  const pos=mg.attributes.position;
  for(let i=0;i<pos.count;i++){
    const v=new THREE.Vector3().fromBufferAttribute(pos,i);
    const n=1+0.32*Math.sin(v.x*3.1)*Math.cos(v.y*2.3+1)*Math.sin(v.z*2.7+2);
    v.multiplyScalar(n);pos.setXYZ(i,v.x,v.y,v.z);
  }
  mg.computeVertexNormals();
  const mm=new THREE.ShaderMaterial({
    uniforms:{},
    vertexShader:`
      varying vec3 vP;varying vec3 vN;varying vec3 vV;
      void main(){
        vP=position;
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        vN=normalMatrix*normal;vV=-mv.xyz;
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      varying vec3 vP;varying vec3 vN;varying vec3 vV;
      ${NOISE_GLSL}
      void main(){
        vec3 p=vP*0.055;
        float w=fbm(p*2.0+vec3(fbm(p*3.0))*1.8);
        float vein=1.0-smoothstep(0.0,0.055,abs(w-0.5));
        float vein2=1.0-smoothstep(0.0,0.16,abs(w-0.5));
        vec3 n=normalize(vN);vec3 v=normalize(vV);
        float fr=pow(1.0-abs(dot(n,v)),3.0);
        vec3 col=vec3(0.035,0.045,0.075);
        col+=vec3(0.75,0.62,0.38)*vein*0.55;
        col+=vec3(0.30,0.28,0.34)*vein2*0.25;
        col+=vec3(0.35,0.45,0.65)*fr*0.5;
        gl_FragColor=vec4(col,1.0);
      }`
  });
  [[60,20,-480,26],[-70,10,-560,34],[80,40,-700,22],[-60,50,-860,30],[40,70,-980,40]].forEach(([x,y,z,s])=>{
    const m=new THREE.Mesh(mg,mm);m.position.set(x,y,z);m.scale.setScalar(s);
    m.rotation.set(rng()*3,rng()*3,rng()*3);scene.add(m);
  });
}
/* drifting dust: near layer + far layer */
let dustNear,dustFar;
function makeDust(N,size,op,spread,yMax){
  const pos=new Float32Array(N*3),vel=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=(rng()-0.5)*spread;pos[i*3+1]=rng()*yMax-20;pos[i*3+2]=-rng()*1000+40;
    vel[i*3]=(rng()-0.5)*1.2;vel[i*3+1]=(rng()-0.5)*0.8;vel[i*3+2]=(rng()-0.5)*1.2;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const p=new THREE.Points(g,new THREE.PointsMaterial({map:GLOWTEX,color:0x9db8ff,size:size,transparent:true,opacity:op,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  p.userData.vel=vel;scene.add(p);return p;
}
dustNear=makeDust(450,2.6,0.55,420,150);
dustFar=makeDust(500,1.2,0.35,700,200);
/* speed streaks (camera-local) */
let streaks;
{
  const N=140,pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){pos[i*3]=(Math.random()-0.5)*60;pos[i*3+1]=(Math.random()-0.5)*40;pos[i*3+2]=-5-Math.random()*100;}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  streaks=new THREE.Points(g,new THREE.PointsMaterial({map:GLOWTEX,color:0xcfe0ff,size:1.1,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  camera.add(streaks);
}
/* pulse rings pool */
const rings=[];
function spawnRing(pos,color){
  const m=new THREE.Mesh(new THREE.TorusGeometry(1,0.09,8,48),
    new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.copy(pos);scene.add(m);
  rings.push({m,t:0});
}

/* ================= ride ================= */
const SPEED_KEYS=[[0,0.002],[0.05,0.004],[0.15,0.0045],[0.20,0.011],[0.28,0.013],[0.35,0.011],[0.55,0.010],[0.62,0.004],[0.70,0.0035],[0.76,0.010],[0.85,0.009],[0.92,0.0035],[1,0.0015]];
const SEG_OF_T=t=>t<0.15?0:t<0.30?1:t<0.55?2:t<0.70?3:t<0.85?4:5;
let riding=false, rt=0, rollSm=0, fovSm=64, curSeg=-1;
const lookP=new THREE.Vector3(), lookT=new THREE.Vector3(), tanV=new THREE.Vector3(), tan2=new THREE.Vector3();
let yawT=0,pitchT=0,yaw=0,pitch=0,dragging=false,dragMoved=0,dragStart=0,sx=0,sy=0;

const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{dragging=true;dragMoved=0;dragStart=performance.now();sx=e.clientX;sy=e.clientY;cvs.setPointerCapture(e.pointerId);});
cvs.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;dragMoved+=Math.abs(dx)+Math.abs(dy);
  if(!hasOrient){yawT=clamp(yawT-dx*0.0035,-1.0,1.0);pitchT=clamp(pitchT-dy*0.003,-0.55,0.55);}
  sx=e.clientX;sy=e.clientY;
});
cvs.addEventListener('pointerup',e=>{
  dragging=false;
  const dt=performance.now()-dragStart;
  if(dragMoved<14&&dt<350&&riding){
    const nowT=performance.now();
    if(hasOrient&&nowT-lastTapT<350&&Math.hypot(e.clientX-lastTapX,e.clientY-lastTapY)<40){
      baseB=lastBeta;baseG=lastGamma;lastTapT=0; // double-tap: recenter view
    }else{
      lastTapT=nowT;lastTapX=e.clientX;lastTapY=e.clientY;
      doPulse(e.clientX,e.clientY);
    }
  }
});
cvs.addEventListener('pointercancel',()=>{dragging=false;});
/* gyroscope look: move the phone to look around, YouTube-360 style.
   Drag remains as the fallback on devices without motion sensors. */
let hasOrient=false,baseB=0,baseG=0,lastBeta=0,lastGamma=0,lastTapT=0,lastTapX=0,lastTapY=0;
function onOrient(e){
  if(e.beta===null||e.gamma===null)return;
  lastBeta=e.beta;lastGamma=e.gamma;
  if(!hasOrient){
    hasOrient=true;baseB=e.beta;baseG=e.gamma;
    hintEl.innerHTML='Move your phone to look around &middot; Tap a cluster to pulse it &middot; Double-tap to recenter';
  }
  const dB=e.beta-baseB;let dG=e.gamma-baseG;
  if(dG>180)dG-=360;if(dG<-180)dG+=360;
  const so=(((screen.orientation||{}).angle)||0)*Math.PI/180;
  yawT=clamp(-(dG*Math.cos(so)+dB*Math.sin(so))*0.02,-1.0,1.0);
  pitchT=clamp(-(-dG*Math.sin(so)+dB*Math.cos(so))*0.015,-0.55,0.55);
}
window.addEventListener('deviceorientation',onOrient);
window.addEventListener('deviceorientationabsolute',onOrient);

const ray=new THREE.Raycaster();
function doPulse(px,py){
  ray.setFromCamera({x:(px/innerWidth)*2-1,y:-(py/innerHeight)*2+1},camera);
  const hits=ray.intersectObjects(clusterMeshes);
  if(!hits.length)return;
  const c=hits[0].object.userData.cluster;
  if(hits[0].distance>170)return;
  c.flash=1;spawnRing(c.grp.position,c.color);chime();
}

/* ================= flow ================= */
const fadeEl=document.getElementById('fade'),titleEl=document.getElementById('title'),
      endEl=document.getElementById('end'),hudEl=document.getElementById('hud'),
      hintEl=document.getElementById('hint'),progEl=document.getElementById('progfill');
function beginRide(){
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().catch(()=>{});
  }
  titleEl.classList.add('hidden');endEl.classList.add('hidden');
  riding=true;rt=0;curSeg=-1;
  hudEl.classList.add('on');hintEl.classList.add('on');
  setTimeout(()=>hintEl.classList.remove('on'),9000);
  setChord(0,false);startMelody();
}
document.getElementById('beginBtn').onclick=beginRide;
document.getElementById('againBtn').onclick=beginRide;
let paused=false;
document.addEventListener('visibilitychange',()=>{paused=document.hidden;});

const orbitC=new THREE.Vector3(0,26,-120);
function preRideCam(now){
  const a=now*0.00006;
  camera.position.set(orbitC.x+Math.cos(a)*90,orbitC.y+14,orbitC.z+Math.sin(a)*90);
  camera.lookAt(orbitC.x,orbitC.y-6,orbitC.z-60);
  camera.fov=60;camera.updateProjectionMatrix();
}
function driftDust(p,dt){
  const dp=p.geometry.attributes.position,vel=p.userData.vel;
  for(let i=0;i<dp.count;i++){
    let y=dp.getY(i)+vel[i*3+1]*dt;
    if(y>160)y=-20;if(y<-25)y=155;
    dp.setXYZ(i,dp.getX(i)+vel[i*3]*dt,y,dp.getZ(i)+vel[i*3+2]*dt);
  }
  dp.needsUpdate=true;
}

/* ================= main loop ================= */
let last=performance.now(),fpsAcc=0,fpsN=0,degraded=false;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-last)/1000,0.05);last=now;
  if(paused)return;
  const tsec=now/1000;
  nebulaUniforms.uTime.value=tsec;
  for(const tm of threadMats)tm.uniforms.uTime.value=tsec;

  for(const c of clusters){
    c.sats.rotation.y=c.orbit+tsec*c.orbitSpd;
    if(c.flash>0){
      c.flash=Math.max(0,c.flash-dt*1.4);
      const f=1+c.flash*1.6;
      c.inner.scale.setScalar(c.scale*4.5*f);
      c.halo.scale.setScalar(c.scale*11*f);
      c.core.material.uniforms.uFlash.value=c.flash;
      c.threads.forEach(m=>{m.uniforms.uFlash.value=c.flash;});
    }
  }
  driftDust(dustNear,dt);driftDust(dustFar,dt);
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.t+=dt;
    r.m.scale.setScalar(1+r.t*34);r.m.material.opacity=Math.max(0,0.9-r.t*1.1);
    r.m.lookAt(camera.position);
    if(r.t>1){scene.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();rings.splice(i,1);}
  }

  if(!riding){preRideCam(now);streaks.material.opacity=0;composer.render();return;}

  const spd=smoothKeys(SPEED_KEYS,rt);
  rt=Math.min(1,rt+spd*dt);
  const seg=SEG_OF_T(rt);
  if(seg!==curSeg){curSeg=seg;setChord(seg,seg===3);}
  curve.getPointAt(rt,lookP);curve.getPointAt(Math.min(1,rt+0.012),lookT);
  camera.position.copy(lookP);
  // cinematic handheld drift
  camera.position.x+=Math.sin(tsec*0.5)*0.7+Math.sin(tsec*1.31)*0.3;
  camera.position.y+=Math.sin(tsec*0.42+2.0)*0.5;
  camera.up.set(0,1,0);camera.lookAt(lookT);
  curve.getTangentAt(rt,tanV);curve.getTangentAt(Math.min(1,rt+0.004),tan2);
  const cross=tanV.x*tan2.z-tanV.z*tan2.x;
  const targetRoll=clamp(-cross*260,-0.55,0.55);
  rollSm=lerp(rollSm,targetRoll,1-Math.pow(0.001,dt));
  camera.rotateZ(rollSm);
  if(!dragging&&!hasOrient){yawT*=Math.pow(0.4,dt);pitchT*=Math.pow(0.4,dt);}
  yaw=lerp(yaw,yawT,1-Math.pow(0.0001,dt));pitch=lerp(pitch,pitchT,1-Math.pow(0.0001,dt));
  camera.rotateY(yaw);camera.rotateX(pitch);
  const sNorm=clamp(spd/0.013,0,1);
  fovSm=lerp(fovSm,62+sNorm*22,1-Math.pow(0.01,dt));
  if(Math.abs(camera.fov-fovSm)>0.1){camera.fov=fovSm;camera.updateProjectionMatrix();}
  {
    const sp=streaks.geometry.attributes.position,vz=(12+sNorm*170)*dt;
    for(let i=0;i<sp.count;i++){
      let z=sp.getZ(i)+vz;
      if(z>2){z-=107;sp.setX(i,(Math.random()-0.5)*60);sp.setY(i,(Math.random()-0.5)*40);}
      sp.setZ(i,z);
    }
    sp.needsUpdate=true;
    streaks.material.opacity=0.04+sNorm*0.5;
  }
  if(AC&&soundOn){
    whooshGain.gain.setTargetAtTime(sNorm*sNorm*0.12,AC.currentTime,0.15);
    whooshFilter.frequency.setTargetAtTime(350+sNorm*1600,AC.currentTime,0.15);
  }
  progEl.style.width=(rt*100).toFixed(1)+'%';

  if(rt>=1){
    riding=false;stopMelody();hudEl.classList.remove('on');
    fadeEl.style.opacity=1;
    setTimeout(()=>{endEl.classList.remove('hidden');fadeEl.style.opacity=0;},1300);
    if(AC){padVoices.forEach(v=>v.g.gain.setTargetAtTime(0.0001,AC.currentTime,1.2));
      droneGain.gain.setTargetAtTime(0.0001,AC.currentTime,1.0);
      whooshGain.gain.setTargetAtTime(0,AC.currentTime,0.4);}
  }
  composer.render();

  if(!degraded){
    fpsAcc+=dt;fpsN++;
    if(fpsN>=140){
      if(fpsAcc/fpsN>0.026){
        degraded=true;renderer.setPixelRatio(1);composer.setPixelRatio(1);
        dustFar.visible=false;bloomPass.strength=0.6;
      }
      fpsAcc=0;fpsN=0;
    }
  }
}
fadeEl.style.opacity=0;
requestAnimationFrame(frame);
</script>
