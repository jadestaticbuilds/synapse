<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Synapse — a neural mindscape ride</title>
<style>
html,body{-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overflow:hidden;background:#04030a;height:100%;touch-action:none;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#fff;}
#stage{position:fixed;inset:0;}
canvas{display:block;}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:28px;transition:opacity .8s;}
.screen.hidden{opacity:0;pointer-events:none;}
#title{background:radial-gradient(ellipse at 50% 120%,rgba(80,40,160,.35),transparent 60%),rgba(4,3,10,.55);}
#title h1{font-size:52px;margin:0;letter-spacing:10px;font-weight:800;
  background:linear-gradient(135deg,#ffd27a,#ff7ad9,#7ae2ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,122,217,.45));}
#title p{color:#b9aee0;font-size:15px;line-height:1.7;max-width:340px;margin:18px 0 30px;}
.btn{pointer-events:auto;cursor:pointer;border:1px solid rgba(255,210,122,.6);color:#fff;font-size:17px;letter-spacing:3px;
  background:linear-gradient(180deg,rgba(255,210,122,.18),rgba(255,210,122,.05));padding:16px 44px;border-radius:14px;min-height:56px;}
.btn:active{transform:scale(.97);}
#end{background:rgba(4,3,10,.72);}
#end h1{font-size:34px;letter-spacing:6px;margin:0 0 10px;color:#ffd27a;}
#end p{color:#b9aee0;margin:0 0 28px;}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;opacity:0;transition:opacity 1s;}
#hud.on{opacity:1;}
#prog{height:3px;background:rgba(255,255,255,.12);margin:14px 18px 0;border-radius:2px;overflow:hidden;}
#progfill{height:100%;width:0%;background:linear-gradient(90deg,#ffd27a,#ff7ad9,#7ae2ff);border-radius:2px;}
#sndBtn{position:fixed;top:26px;right:16px;z-index:20;pointer-events:auto;cursor:pointer;width:46px;height:46px;border-radius:12px;
  border:1px solid rgba(255,255,255,.25);background:rgba(4,3,10,.6);color:#ffd27a;font-size:19px;}
#fade{position:fixed;inset:0;background:#04030a;z-index:9;opacity:1;transition:opacity 1.2s;pointer-events:none;}
#hint{position:fixed;bottom:26px;left:0;right:0;text-align:center;z-index:5;color:#b9aee0;font-size:13px;opacity:0;transition:opacity 1s;pointer-events:none;}
#hint.on{opacity:.85;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="fade"></div>
<div id="hud"><div id="prog"><div id="progfill"></div></div></div>
<button id="sndBtn" aria-label="Toggle sound">&#9834;</button>
<div id="hint">Drag to look around &middot; Tap a cluster to pulse it</div>
<div class="screen" id="title">
  <h1>SYNAPSE</h1>
  <p>A roller-coaster ride through a neural mindscape. Three minutes through the clusters, the threads, and the quiet between them.</p>
  <button class="btn" id="beginBtn">BEGIN THE RIDE</button>
</div>
<div class="screen hidden" id="end">
  <h1>RIDE COMPLETE</h1>
  <p>The threads settle. The clusters keep their light.</p>
  <button class="btn" id="againBtn">RIDE AGAIN</button>
</div>
<script>
'use strict';
/* ================= utils ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rng = mulberry32(1337);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
function smoothKeys(keys,t){ // keys: [[t,v],...] sorted; cosine interp
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){
    const a=keys[i],b=keys[i+1];
    if(t<=b[0]){const u=(t-a[0])/(b[0]-a[0]);const s=(1-Math.cos(u*Math.PI))/2;return lerp(a[1],b[1],s);}
  }
  return keys[keys.length-1][1];
}
// no-zoom lock
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('gesturechange',e=>e.preventDefault());
let lastTE=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTE<300)e.preventDefault();lastTE=n;},{passive:false});

/* ================= audio ================= */
let AC=null, master=null, soundOn=true;
let padOsc=[], padGains=[], whooshGain=null, whooshFilter=null;
const CHORDS=[ // [root midi, intervals] per ride segment
  {root:45,iv:[0,3,7,10,14]},   // Am9  - climb
  {root:41,iv:[0,4,7,11,14]},   // Fmaj9 - drop
  {root:48,iv:[0,4,7,11,14]},   // Cmaj9 - weave
  {root:48,iv:[0,4,7,11,14]},   // Cmaj9 - breather (softer)
  {root:50,iv:[0,3,7,10,14]},   // Dm9   - tunnel
  {root:43,iv:[0,4,7,9,14]},    // G6/9  - finale
];
const m2f=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AC)return;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.85;master.connect(AC.destination);
  // pad: 3 detuned saws through lowpass, per chord tone
  CHORDS[0].iv.forEach((iv,i)=>{
    const o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
    o.type='sawtooth';o.frequency.value=m2f(CHORDS[0].root+iv-12);o.detune.value=(i-2)*5;
    f.type='lowpass';f.frequency.value=900;f.Q.value=0.5;
    g.gain.value=0.0;
    o.connect(f);f.connect(g);g.connect(master);o.start();
    padOsc.push({o,f});padGains.push(g);
  });
  // whoosh: looped noise -> bandpass
  const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const n=AC.createBufferSource();n.buffer=buf;n.loop=true;
  whooshFilter=AC.createBiquadFilter();whooshFilter.type='bandpass';whooshFilter.frequency.value=500;whooshFilter.Q.value=0.8;
  whooshGain=AC.createGain();whooshGain.gain.value=0;
  n.connect(whooshFilter);whooshFilter.connect(whooshGain);whooshGain.connect(master);n.start();
}
function setChord(idx,soft){
  if(!AC)return;const t=AC.currentTime,ch=CHORDS[idx];
  padOsc.forEach((p,i)=>{
    const iv=ch.iv[i%ch.iv.length];
    p.o.frequency.setTargetAtTime(m2f(ch.root+iv-12),t,1.2);
    padGains[i].gain.setTargetAtTime(soft?0.028:0.05,t,1.5);
  });
  padOsc.forEach(p=>p.f.frequency.setTargetAtTime(soft?600:1100,t,1.5));
}
const PENTA=[69,72,74,76,79,81];let pentaIdx=0;
function chime(){
  if(!AC||!soundOn)return;const t=AC.currentTime;
  const m=PENTA[pentaIdx%PENTA.length];pentaIdx++;
  [[ 'triangle',1,0.20],[ 'sine',2,0.07]].forEach(([ty,mult,v])=>{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=ty;o.frequency.value=m2f(m)*mult;
    g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.001,t+1.1);
    o.connect(g);g.connect(master);o.start(t);o.stop(t+1.2);
  });
}
document.getElementById('sndBtn').onclick=e=>{e.stopPropagation();soundOn=!soundOn;
  document.getElementById('sndBtn').style.opacity=soundOn?1:.4;
  if(master)master.gain.setTargetAtTime(soundOn?0.85:0,AC.currentTime,0.1);};

/* ================= three setup ================= */
if(typeof THREE==='undefined'){
  document.getElementById('title').innerHTML='<h1>SYNAPSE</h1><p>Could not load the 3D engine. Check your connection and reload.</p>';
  throw new Error('THREE missing');
}
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.75));
renderer.setSize(innerWidth,innerHeight);
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04030a);
scene.fog=new THREE.FogExp2(0x070512,0.0038);
const camera=new THREE.PerspectiveCamera(64,innerWidth/innerHeight,0.5,4000);
scene.add(new THREE.AmbientLight(0x404060,1.2));
const dl=new THREE.DirectionalLight(0x8877ff,0.6);dl.position.set(50,100,50);scene.add(dl);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// soft radial glow texture
function glowTexture(){
  const c=document.createElement('canvas');c.width=c.height=128;
  const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.25,'rgba(255,255,255,.55)');
  g.addColorStop(0.6,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g;x.fillRect(0,0,128,128);
  const t=new THREE.CanvasTexture(c);return t;
}
const GLOWTEX=glowTexture();
const PALETTE=[0xffd27a,0x7ae2ff,0xb48cff,0x6dffc9,0xff7ad9,0xfff3d6];

/* ================= track ================= */
const PTS=[
  [0,0,0],[12,10,-30],[-12,22,-60],[10,34,-90],[-8,46,-115],[0,58,-140],
  [0,62,-155],[6,50,-175],[0,28,-195],[-4,8,-215],[0,-4,-235],[0,-6,-255],
  [22,0,-280],[-24,4,-305],[28,2,-330],[-28,8,-355],[22,4,-380],[-18,8,-405],[0,10,-430],
  [8,16,-470],[-6,24,-515],[4,30,-560],
  [2,32,-600],[-4,34,-640],[6,32,-680],[-6,34,-720],[0,32,-760],
  [0,40,-800],[4,52,-845],[0,62,-890],[0,66,-930]
].map(p=>new THREE.Vector3(p[0],p[1],p[2]));
const curve=new THREE.CatmullRomCurve3(PTS,false,'catmullrom',0.35);
const trackLen=curve.getLength();
// rail
{
  const tube=new THREE.TubeGeometry(curve,700,0.55,6,false);
  const mat=new THREE.MeshBasicMaterial({color:0x2a2438});
  scene.add(new THREE.Mesh(tube,mat));
  // glowing edge line riding just above the rail
  const edge=new THREE.TubeGeometry(curve,700,0.12,4,false);
  const emat=new THREE.MeshBasicMaterial({color:0xffd27a,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending});
  const em=new THREE.Mesh(edge,emat);em.position.y=0.75;scene.add(em);
}
// ties (instanced) for speed sensation
{
  const g=new THREE.BoxGeometry(3.2,0.25,0.7);
  const m=new THREE.MeshBasicMaterial({color:0x3a3049});
  const N=340,inst=new THREE.InstancedMesh(g,m,N);
  const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),S=new THREE.Vector3(1,1,1),P=new THREE.Vector3(),T=new THREE.Vector3();
  for(let i=0;i<N;i++){
    const t=i/(N-1);curve.getPointAt(t,P);curve.getTangentAt(t,T);
    Q.setFromUnitVectors(new THREE.Vector3(0,0,1),T);
    M.compose(new THREE.Vector3(P.x,P.y-0.7,P.z),Q,S);inst.setMatrixAt(i,M);
  }
  scene.add(inst);
}

/* ================= clusters + threads ================= */
const clusters=[],clusterMeshes=[];
const coreGeo=new THREE.SphereGeometry(1,18,18);
function addCluster(pos,color,scale){
  const grp=new THREE.Group();grp.position.copy(pos);
  const core=new THREE.Mesh(coreGeo,new THREE.MeshBasicMaterial({color:color}));
  core.scale.setScalar(scale);grp.add(core);
  const sm=new THREE.SpriteMaterial({map:GLOWTEX,color:color,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending,depthWrite:false});
  const spr=new THREE.Sprite(sm);spr.scale.setScalar(scale*9);grp.add(spr);
  // satellites
  const sats=new THREE.Group();
  const n=3+Math.floor(rng()*3);
  for(let i=0;i<n;i++){
    const s=new THREE.Mesh(coreGeo,new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.85}));
    const ss=scale*(0.18+rng()*0.22);s.scale.setScalar(ss);
    const a=rng()*Math.PI*2,r=scale*(2.6+rng()*2.2);
    s.position.set(Math.cos(a)*r,(rng()-0.5)*r*1.2,Math.sin(a)*r);
    sats.add(s);
  }
  grp.add(sats);
  scene.add(grp);
  const c={grp,core,spr,sats,color,scale,flash:0,threads:[],orbit:rng()*Math.PI*2,orbitSpd:0.15+rng()*0.3};
  clusters.push(c);clusterMeshes.push(core);core.userData.cluster=c;
  return c;
}
// scatter clusters along the ride (skip tunnel band 0.70-0.85, dressed separately)
{
  const tmp=new THREE.Vector3(),tan=new THREE.Vector3(),side=new THREE.Vector3(),up=new THREE.Vector3(0,1,0);
  let placed=0,guard=0;
  while(placed<52&&guard++<800){
    const t=0.03+rng()*0.94;
    if(t>0.68&&t<0.87)continue;
    curve.getPointAt(t,tmp);curve.getTangentAt(t,tan);
    side.crossVectors(tan,up).normalize();
    const off=(side.clone().multiplyScalar((rng()<0.5?-1:1)*(16+rng()*46)))
      .add(new THREE.Vector3(0,(rng()-0.35)*36,0));
    const pos=tmp.clone().add(off);
    // keep clear of the rail itself
    addCluster(pos,PALETTE[Math.floor(rng()*PALETTE.length)],1.4+rng()*2.6);
    placed++;
  }
  // threads: each cluster links to 2 nearest
  const threadMats=[];
  clusters.forEach((c,i)=>{
    const dists=clusters.map((o,j)=>({j,d:o.grp.position.distanceToSquared(c.grp.position)}))
      .filter(o=>o.j!==i).sort((a,b)=>a.d-b.d).slice(0,2);
    dists.forEach(({j})=>{
      if(j<i)return; // add each pair once
      const o=clusters[j],a=c.grp.position,b=o.grp.position;
      const mid=a.clone().add(b).multiplyScalar(0.5);mid.y+=a.distanceTo(b)*0.12;
      const bc=new THREE.QuadraticBezierCurve3(a,mid,b);
      const tg=new THREE.TubeGeometry(bc,14,0.14,4,false);
      const col=new THREE.Color(c.color).lerp(new THREE.Color(o.color),0.5);
      const tm=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.32,blending:THREE.AdditiveBlending,depthWrite:false});
      const mesh=new THREE.Mesh(tg,tm);scene.add(mesh);
      c.threads.push(tm);o.threads.push(tm);threadMats.push(tm);
    });
  });
}
/* thread tunnel (t 0.70-0.85) */
{
  const ringMat=new THREE.MeshBasicMaterial({color:0x7ae2ff,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false});
  const tmp=new THREE.Vector3(),tan=new THREE.Vector3();
  let prev=null;
  for(let i=0;i<=10;i++){
    const t=0.70+i*0.015;curve.getPointAt(t,tmp);curve.getTangentAt(t,tan);
    const ring=new THREE.Mesh(new THREE.TorusGeometry(15,0.35,6,40),ringMat);
    ring.position.copy(tmp);
    ring.lookAt(tmp.clone().add(tan));
    scene.add(ring);
    if(prev){
      for(let k=0;k<8;k++){
        const a=k/8*Math.PI*2;
        const p1=new THREE.Vector3(Math.cos(a)*15,Math.sin(a)*15,0).add(prev.p);
        const p2=new THREE.Vector3(Math.cos(a)*15,Math.sin(a)*15,0).add(tmp);
        const g=new THREE.BufferGeometry().setFromPoints([p1,p2]);
        scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xb48cff,transparent:true,opacity:0.4,blending:THREE.AdditiveBlending})));
      }
    }
    prev={p:tmp.clone()};
  }
}
/* finale vista: vast distant cluster field */
{
  for(let i=0;i<170;i++){
    const m=new THREE.SpriteMaterial({map:GLOWTEX,color:PALETTE[Math.floor(rng()*PALETTE.length)],
      transparent:true,opacity:0.5+rng()*0.4,blending:THREE.AdditiveBlending,depthWrite:false});
    const s=new THREE.Sprite(m);
    s.position.set((rng()-0.5)*900,20+rng()*220,-980-rng()*700);
    s.scale.setScalar(6+rng()*22);
    scene.add(s);
  }
}
/* marble silhouettes */
{
  const mg=new THREE.IcosahedronGeometry(1,2);
  const pos=mg.attributes.position;
  for(let i=0;i<pos.count;i++){
    const v=new THREE.Vector3().fromBufferAttribute(pos,i);
    const n=1+0.35*Math.sin(v.x*3.1)*Math.cos(v.y*2.3+1)*Math.sin(v.z*2.7+2);
    v.multiplyScalar(n);pos.setXYZ(i,v.x,v.y,v.z);
  }
  mg.computeVertexNormals();
  const mm=new THREE.MeshBasicMaterial({color:0x141824});
  [[60,20,-480,26],[-70,10,-560,34],[80,40,-700,22],[-60,50,-860,30],[40,70,-980,40]].forEach(([x,y,z,s])=>{
    const m=new THREE.Mesh(mg,mm);m.position.set(x,y,z);m.scale.setScalar(s);
    m.rotation.set(rng()*3,rng()*3,rng()*3);scene.add(m);
  });
}
/* drifting dust */
let dust,dustVel;
{
  const N=700,pos=new Float32Array(N*3);dustVel=new Float32Array(N*3);
  for(let i=0;i<N;i++){
    pos[i*3]=(rng()-0.5)*500;pos[i*3+1]=rng()*140-20;pos[i*3+2]=-rng()*1000+40;
    dustVel[i*3]=(rng()-0.5)*1.2;dustVel[i*3+1]=(rng()-0.5)*0.8;dustVel[i*3+2]=(rng()-0.5)*1.2;
  }
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  dust=new THREE.Points(g,new THREE.PointsMaterial({map:GLOWTEX,color:0x9db8ff,size:1.6,transparent:true,opacity:0.5,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  scene.add(dust);
}
/* pulse rings pool */
const rings=[];
function spawnRing(pos,color){
  const m=new THREE.Mesh(new THREE.TorusGeometry(1,0.09,8,48),
    new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:0.9,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.position.copy(pos);scene.add(m);
  rings.push({m,t:0});
}

/* ================= ride ================= */
const SPEED_KEYS=[[0,0.002],[0.05,0.004],[0.15,0.0045],[0.20,0.011],[0.28,0.013],[0.35,0.011],[0.55,0.010],[0.62,0.004],[0.70,0.0035],[0.76,0.010],[0.85,0.009],[0.92,0.0035],[1,0.0015]];
const SEG_OF_T=t=>t<0.15?0:t<0.30?1:t<0.55?2:t<0.70?3:t<0.85?4:5;
let riding=false, rt=0, rollSm=0, fovSm=64, curSeg=-1;
const lookP=new THREE.Vector3(), lookT=new THREE.Vector3(), tanV=new THREE.Vector3(), tan2=new THREE.Vector3(), upV=new THREE.Vector3();
let yawT=0,pitchT=0,yaw=0,pitch=0,dragging=false,dragMoved=0,dragStart=0,sx=0,sy=0;

const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{dragging=true;dragMoved=0;dragStart=performance.now();sx=e.clientX;sy=e.clientY;cvs.setPointerCapture(e.pointerId);});
cvs.addEventListener('pointermove',e=>{
  if(!dragging)return;
  const dx=e.clientX-sx,dy=e.clientY-sy;dragMoved+=Math.abs(dx)+Math.abs(dy);
  yawT=clamp(yawT-dx*0.0035,-1.0,1.0);pitchT=clamp(pitchT-dy*0.003,-0.55,0.55);
  sx=e.clientX;sy=e.clientY;
});
cvs.addEventListener('pointerup',e=>{
  dragging=false;
  const dt=performance.now()-dragStart;
  if(dragMoved<14&&dt<350&&riding)doPulse(e.clientX,e.clientY);
});
cvs.addEventListener('pointercancel',()=>{dragging=false;});

const ray=new THREE.Raycaster();
function doPulse(px,py){
  ray.setFromCamera({x:(px/innerWidth)*2-1,y:-(py/innerHeight)*2+1},camera);
  const hits=ray.intersectObjects(clusterMeshes);
  if(!hits.length)return;
  const c=hits[0].object.userData.cluster;
  if(hits[0].distance>170)return;
  c.flash=1;spawnRing(c.grp.position,c.color);chime();
}

/* ================= flow ================= */
const fadeEl=document.getElementById('fade'),titleEl=document.getElementById('title'),
      endEl=document.getElementById('end'),hudEl=document.getElementById('hud'),
      hintEl=document.getElementById('hint'),progEl=document.getElementById('progfill');
let rides=0;
function beginRide(){
  initAudio();if(AC&&AC.state==='suspended')AC.resume();
  titleEl.classList.add('hidden');endEl.classList.add('hidden');
  riding=true;rt=0;curSeg=-1;rides++;
  hudEl.classList.add('on');hintEl.classList.add('on');
  setTimeout(()=>hintEl.classList.remove('on'),9000);
  setChord(0,false);
}
document.getElementById('beginBtn').onclick=beginRide;
document.getElementById('againBtn').onclick=beginRide;
document.addEventListener('visibilitychange',()=>{if(document.hidden)paused=true;else paused=false;});
let paused=false;

// pre-ride slow orbit vantage
const orbitC=new THREE.Vector3(0,26,-120);
function preRideCam(now){
  const a=now*0.00006;
  camera.position.set(orbitC.x+Math.cos(a)*90,orbitC.y+14,orbitC.z+Math.sin(a)*90);
  camera.lookAt(orbitC.x,orbitC.y-6,orbitC.z-60);
  camera.fov=60;camera.updateProjectionMatrix();
}

/* ================= main loop ================= */
let last=performance.now(),fpsAcc=0,fpsN=0,fpsT=0,degraded=false;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-last)/1000,0.05);last=now;
  if(paused)return;

  // ambient life: satellites orbit, dust drifts, flashes decay
  const tsec=now/1000;
  for(const c of clusters){
    c.sats.rotation.y=c.orbit+tsec*c.orbitSpd;
    if(c.flash>0){
      c.flash=Math.max(0,c.flash-dt*1.4);
      const f=1+c.flash*1.6;
      c.spr.scale.setScalar(c.scale*9*f);
      c.core.material.color.setHex(c.color).lerp(new THREE.Color(0xffffff),c.flash*0.7);
      c.threads.forEach(m=>{m.opacity=0.32+c.flash*0.6;});
    }
  }
  const dp=dust.geometry.attributes.position;
  for(let i=0;i<dp.count;i++){
    let x=dp.getX(i)+dustVel[i*3]*dt,y=dp.getY(i)+dustVel[i*3+1]*dt,z=dp.getZ(i)+dustVel[i*3+2]*dt;
    if(y>150)y=-20;if(y<-25)y=145;
    dp.setXYZ(i,x,y,z);
  }
  dp.needsUpdate=true;
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];r.t+=dt;
    const s=1+r.t*34;r.m.scale.setScalar(s);r.m.material.opacity=Math.max(0,0.9-r.t*1.1);
    r.m.lookAt(camera.position);
    if(r.t>1){scene.remove(r.m);r.m.geometry.dispose();r.m.material.dispose();rings.splice(i,1);}
  }

  if(!riding){preRideCam(now);renderer.render(scene,camera);return;}

  // advance ride
  const spd=smoothKeys(SPEED_KEYS,rt);
  rt=Math.min(1,rt+spd*dt);
  const seg=SEG_OF_T(rt);
  if(seg!==curSeg){curSeg=seg;setChord(seg,seg===3);}
  // camera on rail
  curve.getPointAt(rt,lookP);curve.getPointAt(Math.min(1,rt+0.012),lookT);
  camera.position.copy(lookP);
  camera.up.set(0,1,0);camera.lookAt(lookT);
  // banking from curvature
  curve.getTangentAt(rt,tanV);curve.getTangentAt(Math.min(1,rt+0.004),tan2);
  const cross=tanV.x*tan2.z-tanV.z*tan2.x;
  const targetRoll=clamp(-cross*260,-0.55,0.55);
  rollSm=lerp(rollSm,targetRoll,1-Math.pow(0.001,dt));
  camera.rotateZ(rollSm);
  // look-around
  if(!dragging){yawT*=Math.pow(0.4,dt);pitchT*=Math.pow(0.4,dt);}
  yaw=lerp(yaw,yawT,1-Math.pow(0.0001,dt));pitch=lerp(pitch,pitchT,1-Math.pow(0.0001,dt));
  camera.rotateY(yaw);camera.rotateX(pitch);
  // FOV kick with speed
  const sNorm=clamp(spd/0.013,0,1);
  fovSm=lerp(fovSm,62+sNorm*22,1-Math.pow(0.01,dt));
  if(Math.abs(camera.fov-fovSm)>0.1){camera.fov=fovSm;camera.updateProjectionMatrix();}
  // audio follows speed
  if(AC&&soundOn){
    whooshGain.gain.setTargetAtTime(sNorm*sNorm*0.22,AC.currentTime,0.15);
    whooshFilter.frequency.setTargetAtTime(350+sNorm*1600,AC.currentTime,0.15);
  }
  progEl.style.width=(rt*100).toFixed(1)+'%';

  if(rt>=1){
    riding=false;hudEl.classList.remove('on');
    fadeEl.style.opacity=1;
    setTimeout(()=>{endEl.classList.remove('hidden');fadeEl.style.opacity=0;},1300);
    if(AC){padGains.forEach(g=>g.gain.setTargetAtTime(0.0001,AC.currentTime,1.2));
      whooshGain.gain.setTargetAtTime(0,AC.currentTime,0.4);}
  }
  renderer.render(scene,camera);

  // adaptive quality: one step down if struggling
  if(!degraded){
    fpsAcc+=dt;fpsN++;
    if(fpsN>=140){
      if(fpsAcc/fpsN>0.026){degraded=true;renderer.setPixelRatio(1);
        dust.geometry.setDrawRange(0,350);}
      fpsAcc=0;fpsN=0;
    }
  }
}
fadeEl.style.opacity=0;
requestAnimationFrame(frame);
</script>
